<!doctype html>
<html><head><meta charset="utf-8"><title>manual wusong deploy</title></head>
<body><div id="o">loading</div>
<script>
window.__E=[]; window.onerror=function(m,s,l,c,e){window.__E.push(m+' @'+l+':'+c)}; window.addEventListener('unhandledrejection',e=>window.__E.push('rej:'+(e.reason&&e.reason.message||e.reason)));
window.__READY=false; window.__LOG=[]
</script>
<script type="module">
const FILES=['rime_ice.schema.yaml','default.yaml','symbols_v.yaml','rime_ice.dict.yaml',
 'cn_dicts/8105.dict.yaml','cn_dicts/base.dict.yaml','cn_dicts/ext.dict.yaml','cn_dicts/tencent.dict.yaml','cn_dicts/others.dict.yaml',
 'opencc/s2t.json','opencc/STPhrases.ocd2','opencc/STCharacters.ocd2',
 'lua/select_character.lua','lua/date_translator.lua','lua/lunar.lua','lua/uuid.lua','lua/unicode.lua',
 'lua/number_translator.lua','lua/calc_translator.lua','lua/force_gc.lua','lua/corrector.lua','lua/autocap_filter.lua',
 'lua/v_filter.lua','lua/pin_cand_filter.lua','lua/long_word_filter.lua','lua/reduce_english_filter.lua',
 'lua/search.lua','lua/convert_ar_num_to_zh.lua','lua/convert_ar_num_to_zh/init.lua']
const BASE='https://raw.githubusercontent.com/iDvel/rime-ice/main/'
async function ensureDir(FS,path){let i=1;while((i=path.indexOf('/',i)+1)>0){const d=path.slice(0,i);try{await FS.lstat(d)}catch{await FS.mkdir(d)}}}
const mw = await import('./my-worker.js')   // 同源；录屏页改 /engine/my-worker.js
const { LambdaWorker, asyncFS } = mw
const worker = new LambdaWorker('./worker.js')  // 同源；录屏页改 /engine/worker.js
const FS = asyncFS(worker)
const setIME=worker.register('setIME'), setPageSize=worker.register('setPageSize'), deploy=worker.register('deploy'), processFn=worker.register('process'), reset=worker.register('resetUserDirectory')
const log=(s)=>{window.__LOG.push(s);document.getElementById('o').textContent=s}
try {
  let wrote=0,miss=0; const missFiles=[]
  for (const f of FILES) {
    const p='/rime/'+f
    try { const r=await fetch(BASE+f); if(r.ok){ await ensureDir(FS,p); await FS.writeFile(p,new Uint8Array(await r.arrayBuffer())); wrote++ } else { miss++; missFiles.push(f+'(HTTP'+r.status+')') } } catch(e){ miss++; missFiles.push(f+'(ERR)') }
  }
  log('wrote '+wrote+' files, miss '+miss+' :: '+missFiles.join(','))
  try { await ensureDir(FS,'/rime/default.custom.yaml'); await FS.writeFile('/rime/default.custom.yaml','patch:\n  schema_list:\n    - schema: rime_ice\n') } catch(e){ log('custom err '+e.message) }
  log('deploying...')
  await deploy()
  await setIME('rime_ice'); setPageSize(10)
  window.__rimeEngine={ ready:true, process:i=>processFn(String(i)).then(r=>JSON.stringify(r)) }
  window.__READY=true
  log('READY rime_ice')
} catch(e){ log('ERR '+(e&&e.stack||e)) }
</script>
</body></html>
