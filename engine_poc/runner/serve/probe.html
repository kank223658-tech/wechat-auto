<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "@libreservice/my-worker": "./my-worker.js",
  "@libreservice/micro-plum": "./micro-plum.js"
} }
</script>
</head><body><div id="o">start</div>
<script>
window.__E=[]; window.onerror=function(m,s,l,c,e){window.__E.push('err:'+m+' @'+l+':'+c)}; window.addEventListener('unhandledrejection',function(ev){window.__E.push('rej:'+(ev.reason&&ev.reason.message||ev.reason))});
</script>
<script type="module">
const o=document.getElementById('o')
window.__OK='module-ran'
try {
  const m1 = await import('@libreservice/my-worker')
  window.__OK += ';mw:' + (m1.LambdaWorker?'Lambda':'no') + ':' + (m1.asyncFS?'asyncFS':'no-asyncFS')
  const m2 = await import('@libreservice/micro-plum')
  window.__OK += ';mp:' + (m2.Recipe?'Recipe':'no-Recipe') + ':' + (m2.GitHubDownloader?'GH':'no-GH')
} catch(e){ window.__OK += ';IMP_ERR:' + (e&&e.message||e) }
o.textContent = window.__OK
window.__DONE = window.__OK
</script>
</body></html>
