<!DOCTYPE html><html><head><meta charset="utf-8"><title>删字时序精确测量</title>
<link rel="stylesheet" href="/enhance/keyboard.css"><link rel="stylesheet" href="/enhance/chat_exact.css">
<style>
 body.wx-chat,body.wxkb-open{margin:0}
 .chat-way{position:relative;width:548px;margin:0 auto}
 .chat-txt{display:block;width:100%;height:61px;border:none;outline:none;background:transparent;color:#d5d5d5;font-size:24px;line-height:38px;padding:11px 20px;box-sizing:border-box;resize:none;overflow-y:hidden;white-space:pre-wrap;word-break:break-word}
 #log{position:fixed;top:0;left:0;right:0;max-height:50%;overflow:auto;background:#000d;color:#0f0;font:10px/1.3 monospace;padding:5px;z-index:999999;white-space:pre-wrap}
 #drv{position:fixed;bottom:120px;left:0;right:0;background:#222;color:#fff;padding:8px;z-index:999999}
</style></head>
<body class="wx-chat wxkb-open"><div id="log"></div>
<div id="drv"><button onclick="run()">先放文字再删3字</button><span id="st"></span></div>
<textarea id="txt" class="chat-txt"></textarea>
<script>
let __fc=0;(function(){const t=()=>{__fc++;requestAnimationFrame(t)};requestAnimationFrame(t)})();
const F=()=>'f'+String(__fc).padStart(3,'0');
window.__WX_PINYIN={s:{f:['发','法','罚','乏','伐'],fa:['发','法','罚','乏','伐'],wo:['我','哦','喔'],ni:['你','尼','妮'],hao:['好','号','豪']},p:{niha:['你好'],wo:['我'],ni:['你']},sf:{f:100,fa:100,wo:100,ni:100,hao:100},pf:{niha:100,wo:100,ni:100},bg:{}};
window.__WX_EMOJI={};window.__WX_WXEMOJI={list:[],words:{}};
window.__rimeEngine={ready:true,process:(p)=>Promise.resolve(JSON.stringify({candidates:[]}))};
</script>
<script>
function log(m){const l=document.getElementById('log');l.textContent+='['+F()+'] '+m+'\n';l.scrollTop=l.scrollHeight}
function vtxt(){return document.getElementById('txt').value}
function cands(){return [...document.querySelectorAll('#kbCandList .kb-cand-item')].map(b=>{const s=b.querySelector('.kb-cand-symbol b');if(s)return'['+s.textContent+']';const bb=b.querySelector('b');return bb?bb.textContent:'IMG'}).join(',')}
function compT(){const c=document.querySelector('.wxkb-compose');if(!c)return'(无)';return (c.querySelector('.wxkb-compose-committed')?.textContent||'')+'‖'+[...c.querySelectorAll('.wxkb-compose-syl')].map(s=>s.textContent).join('+')}
document.addEventListener('DOMContentLoaded',()=>{
  const obs=(sel,name)=>{const el=document.querySelector(sel);if(!el)return;new MutationObserver(()=>log('  ★'+name+'→ ['+(sel==='#kbCandList'?cands():compT())+']')).observe(el,{childList:true,subtree:true,characterData:true})};
  obs('#kbCandList','候选条'); obs('.wxkb-compose','组合层');
});
let __set="";
function run(){
  // 直接放一段提交字进去
  const el=document.getElementById('txt'); el.value='你好吗'; __set = el.value;
  el.dispatchEvent(new Event('input',{bubbles:true}));
  log('>>> 初始值="'+el.value+'" 候选=['+cands()+'] 组合层=['+compT()+']');
  // 模拟 deleteHold：每帧删1字（与 keyboard.js 一致路径：slice + dispatch input）
  let left=3; const tick=()=>{ if(left<=0){log('完成');return;} const v=el.value; el.value=v.slice(0,-1); el.dispatchEvent(new Event('input',{bubbles:true})); log('  删1字 → 值="'+el.value+'"  候选=['+cands()+']  组合层=['+compT()+']'); left--; requestAnimationFrame(tick); }; requestAnimationFrame(tick);
}
</script>
<script src="/enhance/keyboard.js"></script>
</body></html>
